<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #e94560;
            font-size: 1.8em;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-start {
            background: #4ade80;
            color: #1a1a2e;
        }
        
        .btn-start:hover:not(:disabled) {
            background: #22c55e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 222, 128, 0.4);
        }
        
        .btn-stop {
            background: #ef4444;
            color: white;
        }
        
        .btn-stop:hover:not(:disabled) {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
        }
        
        .btn-clear {
            background: #64748b;
            color: white;
        }
        
        .btn-clear:hover:not(:disabled) {
            background: #475569;
            transform: translateY(-2px);
        }
        
        .status-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .status-card {
            background: #16213e;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #e94560;
        }
        
        .status-card h3 {
            font-size: 0.9em;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        
        .status-card .value {
            font-size: 1.4em;
            font-weight: bold;
        }
        
        .status-running {
            color: #4ade80;
        }
        
        .status-stopped {
            color: #ef4444;
        }
        
        .console {
            background: #0a0a1a;
            border: 1px solid #2a2a4e;
            border-radius: 10px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .console .timestamp {
            color: #60a5fa;
        }
        
        .console .error {
            color: #ef4444;
        }
        
        .console .success {
            color: #4ade80;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .dot-running {
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }
        
        .dot-stopped {
            background: #ef4444;
            box-shadow: 0 0 10px #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Trading Bot Dashboard</h1>
            <div class="controls">
                <button id="btnStart" class="btn btn-start" onclick="startBot()">▶ Start</button>
                <button id="btnStop" class="btn btn-stop" onclick="stopBot()" disabled>⏹ Stop</button>
                <button id="btnClear" class="btn btn-clear" onclick="clearConsole()">🗑 Clear</button>
            </div>
        </div>
        
        <div class="status-panel">
            <div class="status-card">
                <h3>Status</h3>
                <div class="value" id="botStatus">
                    <span class="dot dot-stopped"></span>Stopped
                </div>
            </div>
            <div class="status-card">
                <h3>Started</h3>
                <div class="value" id="startTime">Not started</div>
            </div>
            <div class="status-card">
                <h3>Lines Output</h3>
                <div class="value" id="outputCount">0</div>
            </div>
            <div class="status-card">
                <h3>Last Update</h3>
                <div class="value" id="lastUpdate">-</div>
            </div>
        </div>
        
        <div class="console" id="console">
            {% if initial_output %}
                {{ initial_output }}
            {% else %}
                Console ready. Press Start to begin monitoring...
            {% endif %}
        </div>
    </div>
    
    <script>
        let outputCount = {{ status.output_count|default:0 }};
        let pollingInterval = null;
        
        function updateUI(status) {
            const isRunning = status.is_running;
            
            // Update buttons
            document.getElementById('btnStart').disabled = isRunning;
            document.getElementById('btnStop').disabled = !isRunning;
            
            // Update status indicator
            const statusDiv = document.getElementById('botStatus');
            if (isRunning) {
                statusDiv.innerHTML = '<span class="dot dot-running pulse"></span>Running';
            } else {
                statusDiv.innerHTML = '<span class="dot dot-stopped"></span>Stopped';
            }
            
            // Update other fields
            document.getElementById('startTime').textContent = status.start_time || 'Not started';
            document.getElementById('outputCount').textContent = status.output_count || 0;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        }
        
        function addToConsole(line) {
            const console = document.getElementById('console');
            const lineDiv = document.createElement('div');
            
            // Color code different types of output
            if (line.includes('ERROR') || line.includes('Error')) {
                lineDiv.className = 'error';
            } else if (line.includes('successfully') || line.includes('success')) {
                lineDiv.className = 'success';
            } else if (line.match(/^\[\d{2}:\d{2}:\d{2}\]/)) {
                lineDiv.className = 'timestamp';
            }
            
            lineDiv.textContent = line;
            console.appendChild(lineDiv);
            console.scrollTop = console.scrollHeight;
        }
        
        function startPolling() {
            // Poll for updates every second
            pollingInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/updates/?last_count=${outputCount}`);
                    const data = await response.json();
                    
                    if (data.lines && data.lines.length > 0) {
                        data.lines.forEach(line => addToConsole(line));
                        outputCount = data.total_count;
                    }
                    
                    updateUI({
                        is_running: data.is_running,
                        start_time: document.getElementById('startTime').textContent,
                        output_count: outputCount
                    });
                    
                    // Stop polling if bot stopped
                    if (!data.is_running) {
                        stopPolling();
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 1000);
        }
        
        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }
        
        async function startBot() {
            try {
                const response = await fetch('/api/start/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': getCSRFToken(),
                    }
                });
                const data = await response.json();
                
                if (data.success) {
                    addToConsole('[SYSTEM] Bot started successfully');
                    updateUI(data.status);
                    startPolling();
                } else {
                    addToConsole(`[ERROR] ${data.message}`);
                }
            } catch (error) {
                addToConsole(`[ERROR] Failed to start bot: ${error}`);
            }
        }
        
        async function stopBot() {
            try {
                const response = await fetch('/api/stop/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': getCSRFToken(),
                    }
                });
                const data = await response.json();
                
                if (data.success) {
                    addToConsole('[SYSTEM] Bot stopped');
                    updateUI(data.status);
                    stopPolling();
                } else {
                    addToConsole(`[ERROR] ${data.message}`);
                }
            } catch (error) {
                addToConsole(`[ERROR] Failed to stop bot: ${error}`);
            }
        }
        
        function clearConsole() {
            const console = document.getElementById('console');
            console.innerHTML = 'Console cleared...\n';
            outputCount = 0;
        }
        
        function getCSRFToken() {
            // Get CSRF token from cookies
            const name = 'csrftoken=';
            const decodedCookie = decodeURIComponent(document.cookie);
            const ca = decodedCookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(name) === 0) {
                    return c.substring(name.length, c.length);
                }
            }
            return '';
        }
        
        // Check initial status
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/status/');
                const status = await response.json();
                updateUI(status);
                
                if (status.is_running) {
                    startPolling();
                }
            } catch (error) {
                console.error('Status check error:', error);
            }
        });
    </script>
</body>
</html>
